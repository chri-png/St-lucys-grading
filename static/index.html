<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Lucy's School for the Blind — Grading System</title>
<style>
  :root {
    --ink: #1a1a1a; --paper: #fdfcf9; --accent: #1d4d3f;
    --accent-light: #e8f0ec; --border: #b8b2a4; --error: #7a2e2e; --error-bg: #fbeaea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.5; }
  header { background: var(--accent); color: var(--paper); padding: 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
  header .title h1 { margin: 0; font-size: 1.4rem; font-weight: normal; }
  header .title p { margin: 0.25rem 0 0; font-size: 0.95rem; opacity: 0.9; }
  header .bar-actions button { font-family: inherit; font-size: 0.9rem; padding: 0.5rem 0.9rem; background: var(--paper); color: var(--accent); border: none; border-radius: 4px; cursor: pointer; }
  main { max-width: 760px; margin: 0 auto; padding: 1.25rem; }
  #message { margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 4px; display: none; }
  #message.show { display: block; }
  #message.success { background: var(--accent-light); border: 1px solid var(--accent); }
  #message.error { background: var(--error-bg); border: 1px solid var(--error); color: var(--error); }
  h2 { font-size: 1.3rem; border-bottom: 2px solid var(--accent-light); padding-bottom: 0.5rem; }
  h3 { font-size: 1.1rem; margin-top: 1.5rem; }
  fieldset { border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1.1rem; margin: 0 0 1.25rem; }
  legend { font-weight: bold; padding: 0 0.4rem; }
  label { display: block; font-weight: bold; margin: 0.85rem 0 0.3rem; }
  label.inline { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: normal; margin: 0.4rem 0.8rem 0.4rem 0; }
  input[type=text], input[type=number], input[type=password], select { width: 100%; font-family: inherit; font-size: 1rem; padding: 0.55rem; border: 1px solid var(--border); border-radius: 4px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #0b5fff; outline-offset: 2px; }
  button.primary { font-family: inherit; font-size: 1rem; padding: 0.65rem 1.2rem; background: var(--accent); color: var(--paper); border: none; border-radius: 4px; cursor: pointer; }
  button.secondary { font-family: inherit; font-size: 1rem; padding: 0.65rem 1.2rem; background: var(--paper); color: var(--accent); border: 2px solid var(--accent); border-radius: 4px; cursor: pointer; }
  button.small { font-size: 0.85rem; padding: 0.35rem 0.7rem; }
  .actions { margin-top: 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
  caption { text-align: left; font-weight: bold; margin-bottom: 0.4rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { background: var(--accent-light); }
  .role-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .role-tabs button { font-family: inherit; font-size: 1rem; padding: 0.6rem 1.1rem; border: 2px solid var(--accent); background: var(--paper); color: var(--accent); border-radius: 4px; cursor: pointer; }
  .role-tabs button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
  .term-block { border: 1px solid var(--border); border-radius: 6px; padding: 0.9rem 1rem; margin-top: 1rem; }
  .term-block h3 { margin-top: 0; }
  .muted { color: #555; font-size: 0.95rem; }
  .password-field { position: relative; }
  .password-field input { padding-right: 3.2rem; }
  .password-toggle {
    position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--accent); font-family: inherit;
    font-size: 0.85rem; padding: 0.35rem 0.5rem; cursor: pointer; border-radius: 4px;
  }
  .password-toggle:hover { background: var(--accent-light); }
  .teacher-edit-classes { border: 1px solid var(--border); border-radius: 6px; padding: 0.8rem; margin-top: 0.5rem; }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>St. Lucy's School for the Blind</h1>
    <p id="header-subtitle">Student Grading System</p>
  </div>
  <div class="bar-actions" id="header-actions"></div>
</header>

<main>
  <div id="message" role="status" aria-live="polite"></div>
  <div id="app"></div>
</main>

<script>
(function () {
  "use strict";

  // Same-origin deployment: API lives under /api on this same server.
  const API_BASE = "/api";

  // Kept in memory only (not localStorage), so it clears on refresh.
  // That's intentional for a shared/public computer; on a personal device
  // you may want to persist this yourself after deploying.
  let session = null; // { token, role, displayName }
  let loginRole = "admin";
  let cachedClasses = [];

  const appEl = document.getElementById("app");
  const messageEl = document.getElementById("message");
  const headerActionsEl = document.getElementById("header-actions");
  const headerSubtitleEl = document.getElementById("header-subtitle");

  function announce(text, isError) {
    messageEl.textContent = text;
    messageEl.className = "show " + (isError ? "error" : "success");
  }
  function clearMessage() { messageEl.className = ""; messageEl.textContent = ""; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function passwordFieldHtml(id, labelText) {
    return `
      <label for="${id}">${labelText}</label>
      <div class="password-field">
        <input type="password" id="${id}" autocomplete="off">
        <button type="button" class="password-toggle" data-toggle-for="${id}" aria-pressed="false">Show</button>
      </div>`;
  }

  function wirePasswordToggles(container) {
    container.querySelectorAll(".password-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.toggleFor);
        if (!input) return;
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? "Show" : "Hide";
        btn.setAttribute("aria-pressed", showing ? "false" : "true");
        btn.setAttribute("aria-label", (showing ? "Show" : "Hide") + " password");
      });
    });
  }

  function average(scores) { return scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 0; }
  function letterGrade(score) {
    if (score >= 90) return "A"; if (score >= 80) return "B";
    if (score >= 70) return "C"; if (score >= 60) return "D"; return "F";
  }

  async function api(path, options = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    if (session && session.token) headers["Authorization"] = "Bearer " + session.token;
    const res = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
    let body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      const detail = (body && body.detail) ? body.detail : "Something went wrong. Please try again.";
      if (res.status === 401 && session) { session = null; render(); }
      throw new Error(detail);
    }
    return body;
  }

  function renderHeaderActions() {
    headerActionsEl.innerHTML = "";
    if (session) {
      const logoutBtn = document.createElement("button");
      logoutBtn.type = "button";
      logoutBtn.textContent = "Log out";
      logoutBtn.addEventListener("click", () => { session = null; clearMessage(); render(); });
      headerActionsEl.appendChild(logoutBtn);
    }
  }

  async function render() {
    renderHeaderActions();
    if (!session) {
      headerSubtitleEl.textContent = "Student Grading System";
      await renderLogin();
    } else if (session.role === "admin") {
      headerSubtitleEl.textContent = "Administrator dashboard";
      await renderAdminDashboard();
    } else if (session.role === "teacher") {
      headerSubtitleEl.textContent = "Teacher dashboard — " + session.displayName;
      await renderTeacherDashboard();
    } else if (session.role === "student") {
      headerSubtitleEl.textContent = "Student dashboard — " + session.displayName;
      await renderStudentDashboard();
    }
  }

  // -----------------------------------------------------------------
  // LOGIN
  // -----------------------------------------------------------------
  async function renderLogin() {
    appEl.innerHTML = `
      <h2>Log in</h2>
      <div class="role-tabs" role="tablist" aria-label="Choose how you want to log in">
        <button type="button" data-role="admin" aria-pressed="${loginRole==="admin"}">Administrator</button>
        <button type="button" data-role="teacher" aria-pressed="${loginRole==="teacher"}">Teacher</button>
        <button type="button" data-role="student" aria-pressed="${loginRole==="student"}">Student</button>
      </div>
      <div id="login-form-area">Loading…</div>
    `;
    appEl.querySelectorAll(".role-tabs button").forEach((btn) => {
      btn.addEventListener("click", () => { loginRole = btn.dataset.role; clearMessage(); render(); });
    });

    const area = document.getElementById("login-form-area");

    if (loginRole === "admin") {
      area.innerHTML = `
        <fieldset>
          <legend>Administrator login</legend>
          ${passwordFieldHtml("admin-password", "Administrator password")}
          <p class="muted">Default password is admin123 the first time the system is used. Change it after logging in.</p>
          <div class="actions"><button type="button" class="primary" id="btn-admin-login">Log in</button></div>
        </fieldset>`;
      wirePasswordToggles(area);
      document.getElementById("btn-admin-login").addEventListener("click", async () => {
        try {
          const pw = document.getElementById("admin-password").value;
          const result = await api("/auth/admin/login", { method: "POST", body: JSON.stringify({ password: pw }) });
          session = { token: result.token, role: result.role, displayName: result.display_name };
          clearMessage(); render();
        } catch (e) { announce(e.message, true); }
      });
    }

    if (loginRole === "teacher") {
      area.innerHTML = `
        <fieldset>
          <legend>Teacher login</legend>
          <label for="teacher-username">Username</label>
          <input type="text" id="teacher-username" autocomplete="off">
          ${passwordFieldHtml("teacher-password", "Password")}
          <div class="actions"><button type="button" class="primary" id="btn-teacher-login">Log in</button></div>
        </fieldset>`;
      wirePasswordToggles(area);
      document.getElementById("btn-teacher-login").addEventListener("click", async () => {
        try {
          const username = document.getElementById("teacher-username").value.trim();
          const password = document.getElementById("teacher-password").value;
          const result = await api("/auth/teacher/login", { method: "POST", body: JSON.stringify({ username, password }) });
          session = { token: result.token, role: result.role, displayName: result.display_name };
          clearMessage(); render();
        } catch (e) { announce(e.message, true); }
      });
    }

    if (loginRole === "student") {
      try {
        cachedClasses = await api("/public/classes");
      } catch (e) { cachedClasses = []; }
      const classOptions = cachedClasses.map((c) => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("");
      area.innerHTML = `
        <fieldset>
          <legend>Student login</legend>
          <label for="student-regno">Registration number</label>
          <input type="text" id="student-regno" autocomplete="off">
          <label for="student-name">Full name</label>
          <input type="text" id="student-name" autocomplete="off">
          <label for="student-class">Class</label>
          <select id="student-class"><option value="">Select your class</option>${classOptions}</select>
          <p class="muted">Enter your registration number, full name, and current class exactly as your school has them on record.</p>
          <div class="actions"><button type="button" class="primary" id="btn-student-login">View my results</button></div>
        </fieldset>`;
      document.getElementById("btn-student-login").addEventListener("click", async () => {
        try {
          const reg_no = document.getElementById("student-regno").value.trim();
          const name = document.getElementById("student-name").value.trim();
          const class_name = document.getElementById("student-class").value;
          const result = await api("/auth/student/login", { method: "POST", body: JSON.stringify({ reg_no, name, class_name }) });
          session = { token: result.token, role: result.role, displayName: result.display_name };
          clearMessage(); render();
        } catch (e) { announce(e.message, true); }
      });
    }
  }

  // -----------------------------------------------------------------
  // ADMIN DASHBOARD
  // -----------------------------------------------------------------
  async function renderAdminDashboard() {
    appEl.innerHTML = "<p class='muted'>Loading…</p>";
    let classes, teachers, students;
    try {
      [classes, teachers, students] = await Promise.all([
        api("/admin/classes"), api("/admin/teachers"), api("/admin/students")
      ]);
    } catch (e) { announce(e.message, true); return; }

    const classListHtml = classes.length
      ? "<ul>" + classes.map((c) => `<li>${escapeHtml(c.name)} <button type="button" class="small secondary" data-remove-class="${escapeHtml(c.name)}">Remove</button></li>`).join("") + "</ul>"
      : "<p class='muted'>No classes yet. Add one below.</p>";

    const teacherRows = teachers.map((t) => `<tr>
        <td>${escapeHtml(t.name)}</td><td>${escapeHtml(t.username)}</td>
        <td>${t.classes.map(escapeHtml).join(", ") || "None"}</td>
      </tr>`).join("");

    const studentRows = students.map((s) => `<tr>
        <td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.reg_no)}</td>
        <td>${escapeHtml(s.class_name || "")}</td><td>${s.result_count}</td>
      </tr>`).join("");

    const classOptions = classes.map((c) => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("");
    const classCheckboxes = classes.map((c) =>
      `<label class="inline"><input type="checkbox" value="${escapeHtml(c.name)}" class="teacher-class-cb"> ${escapeHtml(c.name)}</label>`
    ).join("");

    appEl.innerHTML = `
      <h2>Administrator dashboard</h2>

      <fieldset>
        <legend>Classes</legend>
        ${classListHtml}
        <label for="new-class-name">Add a new class</label>
        <input type="text" id="new-class-name" placeholder="e.g. Grade 5">
        <div class="actions"><button type="button" class="primary" id="btn-add-class">Add class</button></div>
      </fieldset>

      <fieldset>
        <legend>Teachers</legend>
        <label for="teacher-name">Teacher's full name</label>
        <input type="text" id="teacher-name">
        <label for="new-teacher-username">Username</label>
        <input type="text" id="new-teacher-username" autocomplete="off">
        ${passwordFieldHtml("new-teacher-password", "Password")}
        <label>Classes this teacher can access</label>
        ${classCheckboxes || "<p class='muted'>No classes available yet.</p>"}
        <div class="actions"><button type="button" class="primary" id="btn-add-teacher">Add teacher</button></div>
        ${teacherRows ? `<table><caption>Current teachers</caption>
          <tr><th scope="col">Name</th><th scope="col">Username</th><th scope="col">Assigned classes</th></tr>${teacherRows}</table>`
          : "<p class='muted'>No teachers added yet.</p>"}
      </fieldset>

      <fieldset>
        <legend>Reassign a teacher's classes</legend>
        <p class="muted">Forgot to give a teacher access to a class, or need to change it later? Pick the teacher below and update their classes.</p>
        <label for="reassign-teacher-select">Teacher</label>
        <select id="reassign-teacher-select">
          <option value="">Select a teacher</option>
          ${teachers.map((t) => `<option value="${escapeHtml(t.username)}">${escapeHtml(t.name)} (${escapeHtml(t.username)})</option>`).join("")}
        </select>
        <div id="reassign-class-checkboxes">${
          classes.length
            ? classes.map((c) => `<label class="inline"><input type="checkbox" value="${escapeHtml(c.name)}" class="reassign-class-cb"> ${escapeHtml(c.name)}</label>`).join("")
            : "<p class='muted'>No classes available yet.</p>"
        }</div>
        <div class="actions"><button type="button" class="primary" id="btn-reassign-classes">Update classes</button></div>
      </fieldset>

      <fieldset>
        <legend>Reset a teacher's password</legend>
        <p class="muted">If a teacher forgets their password, set a new one here and tell them what it is. For security, existing passwords can't be viewed or recovered — only reset.</p>
        <label for="reset-pw-teacher-select">Teacher</label>
        <select id="reset-pw-teacher-select">
          <option value="">Select a teacher</option>
          ${teachers.map((t) => `<option value="${escapeHtml(t.username)}">${escapeHtml(t.name)} (${escapeHtml(t.username)})</option>`).join("")}
        </select>
        ${passwordFieldHtml("reset-pw-new-password", "New password")}
        <div class="actions"><button type="button" class="primary" id="btn-reset-teacher-password">Set new password</button></div>
      </fieldset>

      <fieldset>
        <legend>Students</legend>
        <label for="new-student-regno">Registration number</label>
        <input type="text" id="new-student-regno" autocomplete="off">
        <label for="new-student-name">Full name</label>
        <input type="text" id="new-student-name">
        <label for="new-student-class">Class</label>
        <select id="new-student-class"><option value="">Select a class</option>${classOptions}</select>
        <div class="actions"><button type="button" class="primary" id="btn-add-student">Enroll student</button></div>
        ${studentRows ? `<table><caption>Currently enrolled students</caption>
          <tr><th scope="col">Name</th><th scope="col">Registration number</th><th scope="col">Class</th><th scope="col">Recorded results</th></tr>${studentRows}</table>`
          : "<p class='muted'>No students enrolled yet.</p>"}
      </fieldset>

      <fieldset>
        <legend>View any student's full results</legend>
        <label for="admin-view-regno">Registration number</label>
        <input type="text" id="admin-view-regno" autocomplete="off">
        <div class="actions"><button type="button" class="secondary" id="btn-admin-view">Show results</button></div>
        <div id="admin-view-output"></div>
      </fieldset>

      <fieldset>
        <legend>Administrator settings</legend>
        ${passwordFieldHtml("admin-new-password", "Change administrator password")}
        <div class="actions"><button type="button" class="secondary" id="btn-change-admin-password">Update password</button></div>
      </fieldset>
    `;
    wirePasswordToggles(appEl);

    const reassignSelect = document.getElementById("reassign-teacher-select");
    reassignSelect.addEventListener("change", () => {
      const username = reassignSelect.value;
      const teacher = teachers.find((t) => t.username === username);
      const currentClasses = teacher ? teacher.classes : [];
      appEl.querySelectorAll(".reassign-class-cb").forEach((cb) => {
        cb.checked = currentClasses.includes(cb.value);
      });
    });

    document.getElementById("btn-reassign-classes").addEventListener("click", async () => {
      const username = reassignSelect.value;
      if (!username) { announce("Please choose a teacher first.", true); return; }
      const selected = Array.from(appEl.querySelectorAll(".reassign-class-cb:checked")).map((cb) => cb.value);
      try {
        await api("/admin/teachers/" + encodeURIComponent(username) + "/classes", {
          method: "PUT", body: JSON.stringify({ classes: selected })
        });
        announce("Updated classes for that teacher.", false);
        render();
      } catch (e) { announce(e.message, true); }
    });

    document.getElementById("btn-reset-teacher-password").addEventListener("click", async () => {
      const username = document.getElementById("reset-pw-teacher-select").value;
      const newPassword = document.getElementById("reset-pw-new-password").value;
      if (!username) { announce("Please choose a teacher first.", true); return; }
      if (!newPassword) { announce("Please enter a new password.", true); return; }
      try {
        await api("/admin/teachers/" + encodeURIComponent(username) + "/password", {
          method: "PUT", body: JSON.stringify({ new_password: newPassword })
        });
        announce("Password reset. Let the teacher know their new password.", false);
        document.getElementById("reset-pw-new-password").value = "";
      } catch (e) { announce(e.message, true); }
    });

    document.getElementById("btn-add-class").addEventListener("click", async () => {
      const name = document.getElementById("new-class-name").value.trim();
      if (!name) { announce("Please enter a class name.", true); return; }
      try { await api("/admin/classes", { method: "POST", body: JSON.stringify({ name }) }); announce("Class \"" + name + "\" added.", false); render(); }
      catch (e) { announce(e.message, true); }
    });

    appEl.querySelectorAll("[data-remove-class]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try { await api("/admin/classes/" + encodeURIComponent(btn.dataset.removeClass), { method: "DELETE" }); announce("Class removed.", false); render(); }
        catch (e) { announce(e.message, true); }
      });
    });

    document.getElementById("btn-add-teacher").addEventListener("click", async () => {
      const name = document.getElementById("teacher-name").value.trim();
      const username = document.getElementById("new-teacher-username").value.trim();
      const password = document.getElementById("new-teacher-password").value;
      const assigned = Array.from(appEl.querySelectorAll(".teacher-class-cb:checked")).map((cb) => cb.value);
      if (!name || !username || !password) { announce("Please fill in the teacher's name, username, and password.", true); return; }
      try {
        await api("/admin/teachers", { method: "POST", body: JSON.stringify({ name, username, password, classes: assigned }) });
        announce("Teacher account created for " + name + ".", false); render();
      } catch (e) { announce(e.message, true); }
    });

    document.getElementById("btn-add-student").addEventListener("click", async () => {
      const reg_no = document.getElementById("new-student-regno").value.trim();
      const name = document.getElementById("new-student-name").value.trim();
      const class_name = document.getElementById("new-student-class").value;
      if (!reg_no || !name || !class_name) { announce("Please fill in registration number, name, and class.", true); return; }
      try {
        await api("/admin/students", { method: "POST", body: JSON.stringify({ reg_no, name, class_name }) });
        announce(name + " has been enrolled in " + class_name + ".", false); render();
      } catch (e) { announce(e.message, true); }
    });

    document.getElementById("btn-admin-view").addEventListener("click", async () => {
      const reg_no = document.getElementById("admin-view-regno").value.trim();
      const output = document.getElementById("admin-view-output");
      try {
        const student = await api("/admin/students/" + encodeURIComponent(reg_no) + "/results");
        output.innerHTML = renderResultHistoryHtml(student);
      } catch (e) { output.innerHTML = "<p class='muted'>" + escapeHtml(e.message) + "</p>"; }
    });

    document.getElementById("btn-change-admin-password").addEventListener("click", async () => {
      const newPw = document.getElementById("admin-new-password").value;
      if (!newPw) { announce("Please enter a new password.", true); return; }
      try {
        await api("/admin/password", { method: "PUT", body: JSON.stringify({ new_password: newPw }) });
        announce("Administrator password updated.", false);
        document.getElementById("admin-new-password").value = "";
      } catch (e) { announce(e.message, true); }
    });
  }

  // -----------------------------------------------------------------
  // TEACHER DASHBOARD
  // -----------------------------------------------------------------
  async function renderTeacherDashboard() {
    appEl.innerHTML = "<p class='muted'>Loading…</p>";
    let me;
    try { me = await api("/teacher/me"); } catch (e) { announce(e.message, true); return; }

    const myClasses = me.classes;
    const classOptions = myClasses.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

    appEl.innerHTML = `
      <h2>Welcome, ${escapeHtml(me.name)}</h2>
      <p class="muted">You have access to: ${myClasses.length ? myClasses.map(escapeHtml).join(", ") : "no classes yet. Ask an administrator to assign you one."}</p>

      <fieldset>
        <legend>Enroll or move a student into your class</legend>
        <label for="t-student-regno">Registration number</label>
        <input type="text" id="t-student-regno" autocomplete="off">
        <label for="t-student-name">Full name (only needed for a new student)</label>
        <input type="text" id="t-student-name">
        <label for="t-student-class">Class</label>
        <select id="t-student-class"><option value="">Select a class</option>${classOptions}</select>
        <div class="actions"><button type="button" class="primary" id="btn-t-set-class">Save</button></div>
      </fieldset>

      <fieldset>
        <legend>Record a result</legend>
        <label for="t-grade-class">Class</label>
        <select id="t-grade-class"><option value="">Select a class</option>${classOptions}</select>
        <label for="t-grade-student">Student</label>
        <select id="t-grade-student"><option value="">Select a class first</option></select>
        <label for="t-grade-term">Term or period (e.g. Term 1 2026)</label>
        <input type="text" id="t-grade-term">
        <label for="t-grade-subject">Subject</label>
        <input type="text" id="t-grade-subject">
        <label for="t-grade-score">Score (0 to 100)</label>
        <input type="number" id="t-grade-score" min="0" max="100" step="1">
        <div class="actions"><button type="button" class="primary" id="btn-t-add-grade">Record result</button></div>
      </fieldset>

      <fieldset>
        <legend>View a class or a student's history</legend>
        <label for="t-view-class">Class</label>
        <select id="t-view-class"><option value="">Select a class</option>${classOptions}</select>
        <div id="t-class-roster"></div>
        <div id="t-student-history"></div>
      </fieldset>
    `;

    document.getElementById("btn-t-set-class").addEventListener("click", async () => {
      const reg_no = document.getElementById("t-student-regno").value.trim();
      const name = document.getElementById("t-student-name").value.trim();
      const class_name = document.getElementById("t-student-class").value;
      if (!reg_no || !class_name) { announce("Please enter a registration number and choose a class.", true); return; }
      try {
        await api("/teacher/students", { method: "POST", body: JSON.stringify({ reg_no, name: name || null, class_name }) });
        announce("Saved.", false); render();
      } catch (e) { announce(e.message, true); }
    });

    const gradeClassSelect = document.getElementById("t-grade-class");
    const gradeStudentSelect = document.getElementById("t-grade-student");
    gradeClassSelect.addEventListener("change", async () => {
      const class_name = gradeClassSelect.value;
      if (!class_name) { gradeStudentSelect.innerHTML = "<option value=''>Select a class first</option>"; return; }
      try {
        const roster = await api("/teacher/classes/" + encodeURIComponent(class_name) + "/students");
        gradeStudentSelect.innerHTML = roster.length
          ? roster.map((s) => `<option value="${escapeHtml(s.reg_no)}">${escapeHtml(s.name)} (${escapeHtml(s.reg_no)})</option>`).join("")
          : "<option value=''>No students in this class</option>";
      } catch (e) { announce(e.message, true); }
    });

    document.getElementById("btn-t-add-grade").addEventListener("click", async () => {
      const reg_no = gradeStudentSelect.value;
      const term = document.getElementById("t-grade-term").value.trim();
      const subject = document.getElementById("t-grade-subject").value.trim();
      const scoreRaw = document.getElementById("t-grade-score").value;
      const score = Number(scoreRaw);
      if (!reg_no) { announce("Please choose a class and a student.", true); return; }
      if (!term) { announce("Please enter a term or period.", true); return; }
      if (!subject) { announce("Please enter a subject.", true); return; }
      if (scoreRaw === "" || isNaN(score) || score < 0 || score > 100) { announce("Please enter a valid score between 0 and 100.", true); return; }
      try {
        await api("/teacher/results", { method: "POST", body: JSON.stringify({ reg_no, term, subject, score }) });
        announce("Result recorded.", false);
        document.getElementById("t-grade-term").value = "";
        document.getElementById("t-grade-subject").value = "";
        document.getElementById("t-grade-score").value = "";
      } catch (e) { announce(e.message, true); }
    });

    const viewClassSelect = document.getElementById("t-view-class");
    viewClassSelect.addEventListener("change", async () => {
      const class_name = viewClassSelect.value;
      const rosterEl = document.getElementById("t-class-roster");
      document.getElementById("t-student-history").innerHTML = "";
      if (!class_name) { rosterEl.innerHTML = ""; return; }
      try {
        const roster = await api("/teacher/classes/" + encodeURIComponent(class_name) + "/students");
        if (!roster.length) { rosterEl.innerHTML = "<p class='muted'>No students in this class yet.</p>"; return; }
        const rows = roster.map((s) => `<tr>
          <td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.reg_no)}</td><td>${s.result_count}</td>
          <td><button type="button" class="small secondary" data-show-history="${escapeHtml(s.reg_no)}">View history</button></td>
        </tr>`).join("");
        rosterEl.innerHTML = `<table><caption>${escapeHtml(class_name)} roster</caption>
          <tr><th scope="col">Name</th><th scope="col">Registration number</th><th scope="col">Results recorded</th><th scope="col">Action</th></tr>${rows}</table>`;
        rosterEl.querySelectorAll("[data-show-history]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              const student = await api("/teacher/students/" + encodeURIComponent(btn.dataset.showHistory) + "/results");
              document.getElementById("t-student-history").innerHTML = renderResultHistoryHtml(student);
            } catch (e) { announce(e.message, true); }
          });
        });
      } catch (e) { announce(e.message, true); }
    });
  }

  // -----------------------------------------------------------------
  // STUDENT DASHBOARD
  // -----------------------------------------------------------------
  async function renderStudentDashboard() {
    appEl.innerHTML = "<p class='muted'>Loading…</p>";
    try {
      const student = await api("/student/me");
      appEl.innerHTML = `
        <h2>Welcome, ${escapeHtml(student.name)}</h2>
        <p class="muted">Registration number: ${escapeHtml(student.reg_no)}. Class: ${escapeHtml(student.class_name || "")}.</p>
        ${renderResultHistoryHtml(student)}
      `;
    } catch (e) { announce(e.message, true); }
  }

  // -----------------------------------------------------------------
  // Shared: full result history, grouped by term, plus overall average
  // -----------------------------------------------------------------
  function renderResultHistoryHtml(student) {
    if (!student.results.length) {
      return "<p class='muted'>No results have been recorded for " + escapeHtml(student.name) + " yet.</p>";
    }
    const byTerm = {};
    const termOrder = [];
    student.results.forEach((rec) => {
      if (!byTerm[rec.term]) { byTerm[rec.term] = []; termOrder.push(rec.term); }
      byTerm[rec.term].push(rec);
    });

    let html = `<h3>Full result history for ${escapeHtml(student.name)}</h3>`;
    termOrder.forEach((term) => {
      const recs = byTerm[term];
      const scores = recs.map((r) => r.score);
      const termAvg = average(scores);
      const rows = recs.map((r) => `<tr><td>${escapeHtml(r.subject)}</td><td>${r.score}</td><td>${letterGrade(r.score)}</td></tr>`).join("");
      html += `<div class="term-block">
        <h3>${escapeHtml(term)}</h3>
        <table><caption>Results for ${escapeHtml(term)}</caption>
          <tr><th scope="col">Subject</th><th scope="col">Score</th><th scope="col">Grade</th></tr>${rows}</table>
        <p><strong>Term average: ${termAvg.toFixed(1)}. Term grade: ${letterGrade(termAvg)}.</strong></p>
      </div>`;
    });

    const allScores = student.results.map((r) => r.score);
    const overallAvg = average(allScores);
    html += `<div class="term-block">
      <h3>Overall, across all recorded terms</h3>
      <p><strong>Overall average: ${overallAvg.toFixed(1)}. Overall grade: ${letterGrade(overallAvg)}.</strong></p>
      <p class="muted">Based on ${student.results.length} recorded result${student.results.length === 1 ? "" : "s"} across ${termOrder.length} term${termOrder.length === 1 ? "" : "s"}.</p>
    </div>`;
    return html;
  }

  render();
})();
</script>
</body>
</html>
