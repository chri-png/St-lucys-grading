<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Lucy's School for the Blind — Grading System</title>
<style>
  :root {
    --ink: #1a1a1a; --paper: #f7f8f6; --surface: #ffffff; --accent: #1d4d3f;
    --accent-light: #e8f0ec; --border: #d6d2c4; --error: #7a2e2e; --error-bg: #fbeaea;
    --shadow: 0 1px 3px rgba(20, 30, 25, 0.07), 0 1px 2px rgba(20, 30, 25, 0.05);
    --muted: #5a5f5a;
    --sidebar-width: 260px;
  }
  html[data-theme="dark"] {
    --ink: #eef1ee; --paper: #12161a; --surface: #1c2226; --accent: #56b98a;
    --accent-light: #223129; --border: #384039; --error: #ff9b9b; --error-bg: #3a2222;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
    --muted: #a3aca4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.55;
  }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 1.3rem; border-bottom: 2px solid var(--accent-light); padding-bottom: 0.5rem; margin-top: 0; }
  h3 { font-size: 1.1rem; margin-top: 1.5rem; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.1rem; margin: 0 0 1.25rem; background: var(--surface); box-shadow: var(--shadow); }
  legend { font-weight: 600; padding: 0 0.4rem; }
  label { display: block; font-weight: 600; margin: 0.85rem 0 0.3rem; }
  label.inline { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: normal; margin: 0.4rem 0.8rem 0.4rem 0; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    width: 100%; font-family: inherit; font-size: 1rem; padding: 0.55rem; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  textarea { min-height: 4.5rem; resize: vertical; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid #0b5fff; outline-offset: 2px; }
  button.primary { font-family: inherit; font-size: 1rem; padding: 0.65rem 1.2rem; background: var(--accent); color: var(--paper); border: none; border-radius: 4px; cursor: pointer; }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  button.secondary { font-family: inherit; font-size: 1rem; padding: 0.65rem 1.2rem; background: var(--paper); color: var(--accent); border: 2px solid var(--accent); border-radius: 4px; cursor: pointer; }
  button.danger { font-family: inherit; font-size: 0.85rem; padding: 0.35rem 0.7rem; background: var(--error-bg); color: var(--error); border: 1px solid var(--error); border-radius: 4px; cursor: pointer; }
  button.small { font-size: 0.85rem; padding: 0.35rem 0.7rem; }
  .actions { margin-top: 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
  caption { text-align: left; font-weight: bold; margin-bottom: 0.4rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { background: var(--accent-light); }
  .role-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .role-tabs button { font-family: inherit; font-size: 1rem; padding: 0.6rem 1.1rem; border: 2px solid var(--accent); background: var(--paper); color: var(--accent); border-radius: 4px; cursor: pointer; }
  .role-tabs button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
  .term-block { border: 1px solid var(--border); border-radius: 6px; padding: 0.9rem 1rem; margin-top: 1rem; }
  .term-block h3 { margin-top: 0; }
  .muted { color: var(--muted); font-size: 0.95rem; }
  .password-field { position: relative; }
  .password-field input { padding-right: 3.2rem; }
  .password-toggle { position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--accent); font-family: inherit; font-size: 0.85rem; padding: 0.35rem 0.5rem; cursor: pointer; border-radius: 4px; }
  .password-toggle:hover { background: var(--accent-light); }
  .result-row { border: 1px solid var(--border); border-radius: 6px; padding: 0.8rem; margin-top: 0.6rem; }
  .result-row .actions { margin-top: 0.6rem; }

  /* ---- Login screen ---- */
  .login-screen { max-width: 640px; margin: 0 auto; padding: 1.5rem; }
  .login-header { padding: 1.25rem 0 1.5rem; }
  .login-header h1 { margin: 0; font-size: 1.5rem; color: var(--accent); font-weight: normal; }
  .login-header p { margin: 0.3rem 0 0; color: var(--muted); }
  #login-message { margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 4px; display: none; }

  /* ---- App shell ---- */
  #app-shell { display: flex; min-height: 100vh; }
  .sidebar { width: var(--sidebar-width); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-brand { padding: 1.25rem 1.1rem; border-bottom: 1px solid var(--border); }
  .sidebar-brand strong { display: block; color: var(--accent); font-size: 1.05rem; }
  .sidebar-brand span { font-size: 0.8rem; color: var(--muted); }
  #sidebar-nav { flex: 1; overflow-y: auto; padding: 0.6rem 0; }
  .sidebar-footer { padding: 0.9rem 1.1rem; border-top: 1px solid var(--border); }
  .sidebar-footer button { width: 100%; font-family: inherit; font-size: 0.95rem; padding: 0.6rem; background: var(--paper); color: var(--accent); border: 2px solid var(--accent); border-radius: 4px; cursor: pointer; }

  .nav-top-btn, .nav-top-link {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    padding: 0.7rem 1.1rem; background: none; border: none; border-left: 3px solid transparent;
    text-align: left; font-family: inherit; font-size: 0.97rem; color: var(--ink); cursor: pointer; text-decoration: none;
  }
  .nav-top-btn:hover, .nav-top-link:hover { background: var(--accent-light); }
  .nav-top-btn[aria-expanded="true"], .nav-top-link[aria-current="page"], .nav-top-btn.has-active-child {
    border-left-color: var(--accent); background: var(--accent-light); font-weight: bold;
  }
  .nav-chevron { display: inline-block; transition: transform 0.15s; font-size: 0.8rem; }
  .nav-top-btn[aria-expanded="true"] .nav-chevron { transform: rotate(90deg); }
  .nav-children { list-style: none; margin: 0; padding: 0; }
  .nav-children a {
    display: block; padding: 0.55rem 1.1rem 0.55rem 2.3rem; color: var(--ink); text-decoration: none;
    font-size: 0.9rem; border-left: 3px solid transparent;
  }
  .nav-children a:hover { background: var(--accent-light); }
  .nav-children a[aria-current="page"] { border-left-color: var(--accent); font-weight: bold; background: var(--accent-light); }

  .main-column { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; gap: 0.5rem; }
  #breadcrumb { font-size: 0.92rem; color: var(--muted); }
  #breadcrumb a { color: var(--accent); text-decoration: none; }
  #breadcrumb a:hover { text-decoration: underline; }
  #breadcrumb .crumb-current { color: var(--ink); font-weight: bold; }
  #breadcrumb .crumb-sep { margin: 0 0.4rem; color: var(--muted); }
  #topbar-user { font-size: 0.9rem; color: var(--muted); }

  #message { margin: 1rem 1.5rem 0; padding: 0.75rem 1rem; border-radius: 4px; display: none; }
  #message.show, #login-message.show { display: block; }
  #message.success, #login-message.success { background: var(--accent-light); border: 1px solid var(--accent); }
  #message.error, #login-message.error { background: var(--error-bg); border: 1px solid var(--error); color: var(--error); }

  #page-content { padding: 1.25rem 1.5rem 2.5rem; max-width: 900px; }
  #page-content:focus { outline: none; }

  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; margin: 1rem 0 1.75rem; }
  .stat-card { border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.1rem; background: var(--surface); box-shadow: var(--shadow); }
  .stat-card .stat-value { font-size: 1.7rem; font-weight: bold; color: var(--accent); }
  .stat-card .stat-label { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }

  .theme-toggle-wrap { position: fixed; top: 0.85rem; right: 1rem; z-index: 60; }
  .theme-toggle-btn {
    font-family: inherit; font-size: 0.88rem; padding: 0.5rem 0.9rem; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 0.35rem;
  }
  .theme-toggle-btn:hover { background: var(--accent-light); }
  .theme-menu {
    position: absolute; right: 0; top: calc(100% + 0.4rem); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); min-width: 150px; overflow: hidden;
  }
  .theme-menu button {
    display: block; width: 100%; text-align: left; padding: 0.6rem 0.9rem; background: none; border: none;
    font-family: inherit; font-size: 0.9rem; color: var(--ink); cursor: pointer;
  }
  .theme-menu button:hover { background: var(--accent-light); }
  .theme-menu button[aria-pressed="true"] { font-weight: 600; }
  .theme-menu button[aria-pressed="true"]::after { content: " ✓"; }

  .mobile-menu-toggle { display: none; }
  .sidebar-overlay { display: none; }

  @media (max-width: 900px) {
    .sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; z-index: 40; overflow-y: auto;
      transform: translateX(-100%); transition: transform 0.2s; box-shadow: 2px 0 10px rgba(0,0,0,0.2);
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-menu-toggle {
      display: flex; align-items: center; gap: 0.4rem; margin: 0.9rem 1.5rem 0; padding: 0.55rem 1rem;
      background: var(--accent); color: var(--paper); border: none; border-radius: 4px; font-family: inherit; font-size: 0.95rem; cursor: pointer;
    }
    .sidebar-overlay.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 30; }
    .main-column { width: 100%; }
    #page-content { padding: 1rem; }
  }
</style>
</head>
<body>

<div class="theme-toggle-wrap">
  <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" aria-haspopup="true" aria-expanded="false">
    <span>Theme</span><span aria-hidden="true">&#9662;</span>
  </button>
  <div class="theme-menu" id="theme-menu" hidden role="menu" aria-label="Choose theme">
    <button type="button" data-theme-choice="light" role="menuitemradio">Light mode</button>
    <button type="button" data-theme-choice="dark" role="menuitemradio">Dark mode</button>
  </div>
</div>

<div id="login-screen" class="login-screen">
  <div class="login-header">
    <h1>St. Lucy's School for the Blind</h1>
    <p>Student Grading System</p>
  </div>
  <div id="login-message" role="status" aria-live="polite"></div>
  <div id="login-content"></div>
</div>

<div id="app-shell" hidden>
  <button type="button" id="mobile-menu-toggle" class="mobile-menu-toggle" aria-expanded="false" aria-controls="sidebar">
    <span aria-hidden="true">&#9776;</span> Menu
  </button>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand">
      <strong>St. Lucy's</strong>
      <span>School for the Blind</span>
    </div>
    <nav id="sidebar-nav" aria-label="Sections"></nav>
    <div class="sidebar-footer">
      <button type="button" id="btn-logout">Exit / Log out</button>
    </div>
  </aside>
  <div class="main-column">
    <header class="topbar">
      <nav aria-label="Breadcrumb" id="breadcrumb"></nav>
      <div id="topbar-user"></div>
    </header>
    <div id="message" role="status" aria-live="polite"></div>
    <main id="page-content" tabindex="-1"></main>
  </div>
</div>

<script>
(function () {
  "use strict";

  const API_BASE = "/api";

  let session = null; // { token, role, displayName }
  let loginRole = "admin";
  let expandedNavIds = new Set();
  let theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";

  const loginScreenEl = document.getElementById("login-screen");
  const loginContentEl = document.getElementById("login-content");
  const loginMessageEl = document.getElementById("login-message");
  const appShellEl = document.getElementById("app-shell");
  const sidebarEl = document.getElementById("sidebar");
  const sidebarNavEl = document.getElementById("sidebar-nav");
  const sidebarOverlayEl = document.getElementById("sidebar-overlay");
  const mobileToggleEl = document.getElementById("mobile-menu-toggle");
  const breadcrumbEl = document.getElementById("breadcrumb");
  const topbarUserEl = document.getElementById("topbar-user");
  const messageEl = document.getElementById("message");
  const pageEl = document.getElementById("page-content");
  const themeToggleBtn = document.getElementById("theme-toggle-btn");
  const themeMenuEl = document.getElementById("theme-menu");

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    themeMenuEl.querySelectorAll("[data-theme-choice]").forEach((btn) => {
      btn.setAttribute("aria-pressed", btn.dataset.themeChoice === theme ? "true" : "false");
    });
  }

  function closeThemeMenu() {
    themeMenuEl.hidden = true;
    themeToggleBtn.setAttribute("aria-expanded", "false");
  }

  themeToggleBtn.addEventListener("click", () => {
    const willOpen = themeMenuEl.hidden;
    themeMenuEl.hidden = !willOpen;
    themeToggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
  });
  themeMenuEl.querySelectorAll("[data-theme-choice]").forEach((btn) => {
    btn.addEventListener("click", () => {
      theme = btn.dataset.themeChoice;
      applyTheme();
      closeThemeMenu();
    });
  });
  document.addEventListener("click", (e) => {
    if (!themeMenuEl.hidden && !themeMenuEl.contains(e.target) && e.target !== themeToggleBtn) closeThemeMenu();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !themeMenuEl.hidden) { closeThemeMenu(); themeToggleBtn.focus(); }
  });
  applyTheme();

  function announce(text, isError) {
    const target = session ? messageEl : loginMessageEl;
    target.textContent = text;
    target.className = "show " + (isError ? "error" : "success");
  }
  function clearMessage() {
    messageEl.className = ""; messageEl.textContent = "";
    loginMessageEl.className = ""; loginMessageEl.textContent = "";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function average(nums) { return nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : 0; }

  // ---- CBE-style grading ----
  function cbeFull(score) {
    if (score >= 76) return "Exceeding Expectation (EE)";
    if (score >= 51) return "Meeting Expectation (ME)";
    if (score >= 26) return "Approaching Expectation (AE)";
    return "Below Expectation (BE)";
  }
  const CBE_LEVELS = [
    { code: "EE", score: 88, label: "Exceeding Expectation (EE) — 76 to 100" },
    { code: "ME", score: 63, label: "Meeting Expectation (ME) — 51 to 75" },
    { code: "AE", score: 38, label: "Approaching Expectation (AE) — 26 to 50" },
    { code: "BE", score: 12, label: "Below Expectation (BE) — 0 to 25" },
  ];
  function cbeLevelOptionsHtml(selectedCode) {
    return CBE_LEVELS.map((l) =>
      `<option value="${l.code}" ${l.code === selectedCode ? "selected" : ""}>${escapeHtml(l.label)}</option>`
    ).join("");
  }
  function scoreForLevel(code) {
    const level = CBE_LEVELS.find((l) => l.code === code);
    return level ? level.score : 0;
  }
  function levelForScore(score) {
    const match = CBE_LEVELS.find((l) => l.score === score);
    return match ? match.code : null;
  }
  function scoreEntryFieldsHtml(idPrefix, defaultMode) {
    return `
      <label>How would you like to enter this?</label>
      <label class="inline"><input type="radio" name="${idPrefix}-mode" value="level" ${defaultMode === "level" ? "checked" : ""}> Choose a rubric level</label>
      <label class="inline"><input type="radio" name="${idPrefix}-mode" value="number" ${defaultMode === "number" ? "checked" : ""}> Enter a numeric score</label>
      <div id="${idPrefix}-level-wrap" style="${defaultMode === "level" ? "" : "display:none;"}">
        <label for="${idPrefix}-level">Rubric level</label>
        <select id="${idPrefix}-level">${cbeLevelOptionsHtml("EE")}</select>
      </div>
      <div id="${idPrefix}-score-wrap" style="${defaultMode === "number" ? "" : "display:none;"}">
        <label for="${idPrefix}-score">Score (0 to 100)</label>
        <input type="number" id="${idPrefix}-score" min="0" max="100" step="1">
      </div>`;
  }
  function wireScoreEntryToggle(container, idPrefix) {
    container.querySelectorAll(`input[name="${idPrefix}-mode"]`).forEach((radio) => {
      radio.addEventListener("change", () => {
        if (!radio.checked) return;
        document.getElementById(idPrefix + "-level-wrap").style.display = radio.value === "level" ? "" : "none";
        document.getElementById(idPrefix + "-score-wrap").style.display = radio.value === "number" ? "" : "none";
      });
    });
  }
  function readScoreEntry(container, idPrefix) {
    const mode = container.querySelector(`input[name="${idPrefix}-mode"]:checked`).value;
    if (mode === "level") {
      const code = document.getElementById(idPrefix + "-level").value;
      return { score: scoreForLevel(code), valid: true };
    }
    const raw = document.getElementById(idPrefix + "-score").value;
    const score = Number(raw);
    const valid = raw !== "" && !isNaN(score) && score >= 0 && score <= 100;
    return { score, valid };
  }

  // ---- Password show/hide ----
  function passwordFieldHtml(id, labelText) {
    return `
      <label for="${id}">${labelText}</label>
      <div class="password-field">
        <input type="password" id="${id}" autocomplete="off">
        <button type="button" class="password-toggle" data-toggle-for="${id}" aria-pressed="false">Show</button>
      </div>`;
  }
  function wirePasswordToggles(container) {
    container.querySelectorAll(".password-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.toggleFor);
        if (!input) return;
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? "Show" : "Hide";
        btn.setAttribute("aria-pressed", showing ? "false" : "true");
      });
    });
  }

  async function withLoadingButton(button, loadingText, fn) {
    const original = button.textContent;
    button.disabled = true;
    button.textContent = loadingText;
    try { await fn(); } finally { button.disabled = false; button.textContent = original; }
  }

  async function api(path, options = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    if (session && session.token) headers["Authorization"] = "Bearer " + session.token;
    const res = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
    let body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      const detail = (body && body.detail) ? body.detail : "Something went wrong. Please try again.";
      if (res.status === 401 && session) { session = null; renderAll(); }
      throw new Error(detail);
    }
    return body;
  }

  async function downloadReportCard(path, filename, triggerBtn) {
    const original = triggerBtn ? triggerBtn.textContent : null;
    if (triggerBtn) { triggerBtn.disabled = true; triggerBtn.textContent = "Preparing PDF…"; }
    try {
      const headers = {};
      if (session && session.token) headers["Authorization"] = "Bearer " + session.token;
      const res = await fetch(API_BASE + path, { headers });
      if (!res.ok) {
        let detail = "Could not generate the report card.";
        try { const body = await res.json(); if (body.detail) detail = body.detail; } catch (e) { /* ignore */ }
        throw new Error(detail);
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) { announce(e.message, true); }
    finally { if (triggerBtn) { triggerBtn.disabled = false; triggerBtn.textContent = original; } }
  }

  function aggregateByTermSubject(results) {
    const termMap = {}; const termOrder = [];
    results.forEach((r) => {
      if (!termMap[r.term]) { termMap[r.term] = { subjects: {}, subjectOrder: [] }; termOrder.push(r.term); }
      const t = termMap[r.term];
      if (!t.subjects[r.subject]) { t.subjects[r.subject] = { total: 0, components: [] }; t.subjectOrder.push(r.subject); }
      t.subjects[r.subject].total += r.score;
      t.subjects[r.subject].components.push(r);
    });
    return { termMap, termOrder };
  }

  function renderResultHistoryHtml(student) {
    if (!student.results.length) {
      return "<p class='muted'>No results have been recorded for " + escapeHtml(student.name) + " yet.</p>";
    }
    const { termMap, termOrder } = aggregateByTermSubject(student.results);
    const allSubjectTotals = [];
    let html = `<h3>Full result history for ${escapeHtml(student.name)}</h3>`;
    termOrder.forEach((term) => {
      const t = termMap[term];
      const subjectTotals = [];
      let subjectBlocks = "";
      t.subjectOrder.forEach((subject) => {
        const s = t.subjects[subject];
        subjectTotals.push(s.total); allSubjectTotals.push(s.total);
        const componentLines = s.components.length > 1
          ? "<ul>" + s.components.map((c) => `<li>${c.comment ? escapeHtml(c.comment) : "Entry"}: ${c.score}%</li>`).join("") + "</ul>"
          : (s.components[0].comment ? `<p class="muted">${escapeHtml(s.components[0].comment)}</p>` : "");
        subjectBlocks += `<div style="margin-top:0.7rem;">
          <strong>${escapeHtml(subject)}: ${s.total}% — ${cbeFull(s.total)}</strong>
          ${componentLines}
        </div>`;
      });
      const termAvg = average(subjectTotals);
      html += `<div class="term-block">
        <h3>${escapeHtml(term)}</h3>
        ${subjectBlocks}
        <p style="margin-top:0.8rem;"><strong>Term average: ${termAvg.toFixed(1)}% — ${cbeFull(termAvg)}</strong></p>
      </div>`;
    });
    const overallAvg = average(allSubjectTotals);
    html += `<div class="term-block">
      <h3>Overall, across all recorded terms</h3>

      "admin/teachers": { label: "All Teachers", parent: "Teachers", render: pageAdminTeachersAll },

  function currentPath() {
    return (location.hash || "").replace(/^#\/?/, "") || null;
  }

  // ---- Sidebar ----
  function renderSidebar(role, activePath) {
    const items = NAV[role];
    sidebarNavEl.innerHTML = "";
    items.forEach((item) => {
      const wrapper = document.createElement("div");
      wrapper.className = "nav-item";

      if (item.children) {
        const activeChild = item.children.find((c) => c.path === activePath);
        const isExpanded = !!activeChild || expandedNavIds.has(item.id);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "nav-top-btn" + (activeChild ? " has-active-child" : "");
        btn.setAttribute("aria-expanded", isExpanded ? "true" : "false");
        btn.innerHTML = `<span>${escapeHtml(item.label)}</span><span class="nav-chevron" aria-hidden="true">&#9656;</span>`;
        btn.addEventListener("click", () => {
          if (expandedNavIds.has(item.id)) expandedNavIds.delete(item.id);
          else expandedNavIds.add(item.id);
          renderSidebar(role, activePath);
        });
        wrapper.appendChild(btn);

        const list = document.createElement("ul");
        list.className = "nav-children";
        list.hidden = !isExpanded;
        item.children.forEach((child) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "#/" + child.path;
          a.textContent = child.label;
          if (child.path === activePath) a.setAttribute("aria-current", "page");
          a.addEventListener("click", closeMobileSidebar);
          li.appendChild(a);
          list.appendChild(li);
        });
        wrapper.appendChild(list);
      } else {
        const a = document.createElement("a");
        a.href = "#/" + item.path;
        a.className = "nav-top-link";
        a.innerHTML = `<span>${escapeHtml(item.label)}</span>`;
        if (item.path === activePath) a.setAttribute("aria-current", "page");
        a.addEventListener("click", closeMobileSidebar);
        wrapper.appendChild(a);
      }

      sidebarNavEl.appendChild(wrapper);
    });
  }

  function closeMobileSidebar() {
    sidebarEl.classList.remove("open");
    sidebarOverlayEl.classList.remove("open");
    mobileToggleEl.setAttribute("aria-expanded", "false");
  }

  // ---- Breadcrumb ----
  function renderBreadcrumb(role, path) {
    const route = ROUTES[role][path];
    const parts = [];
    const dashboardPath = DEFAULT_PATH[role];
    if (path !== dashboardPath) {
      parts.push(`<a href="#/${dashboardPath}">Dashboard</a>`);
      parts.push(`<span class="crumb-sep" aria-hidden="true">&rsaquo;</span>`);
    }
    if (route.parent) {
      parts.push(`<span>${escapeHtml(route.parent)}</span>`);
      parts.push(`<span class="crumb-sep" aria-hidden="true">&rsaquo;</span>`);
    }
    parts.push(`<span class="crumb-current" aria-current="page">${escapeHtml(route.label)}</span>`);
    breadcrumbEl.innerHTML = parts.join("");
  }

  // ---- Router ----
  async function renderRoute() {
    const role = session.role;
    let path = currentPath();
    if (!path || !ROUTES[role][path]) {
      location.hash = "#/" + DEFAULT_PATH[role];
      return; // hashchange will re-trigger renderRoute
    }
    renderSidebar(role, path);
    renderBreadcrumb(role, path);
    topbarUserEl.textContent = session.displayName + " (" + role.charAt(0).toUpperCase() + role.slice(1) + ")";
    pageEl.innerHTML = "<p class='muted'>Loading…</p>";
    try {
      await ROUTES[role][path].render();
    } catch (e) {
      pageEl.innerHTML = "<p class='muted'>" + escapeHtml(e.message || "Something went wrong.") + "</p>";
    }
    pageEl.focus();
  }

  window.addEventListener("hashchange", () => { if (session) renderRoute(); });

  // ===================================================================
  // Top-level render dispatcher
  // ===================================================================
  async function renderAll() {
    if (!session) {
      appShellEl.hidden = true;
      loginScreenEl.hidden = false;
      await renderLogin();
    } else {
      loginScreenEl.hidden = true;
      appShellEl.hidden = false;
      await renderRoute();
    }
  }

  document.getElementById("btn-logout").addEventListener("click", () => {
    session = null;
    clearMessage();
    location.hash = "";
    renderAll();
  });

  mobileToggleEl.addEventListener("click", () => {
    const isOpen = sidebarEl.classList.toggle("open");
    sidebarOverlayEl.classList.toggle("open", isOpen);
    mobileToggleEl.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });
  sidebarOverlayEl.addEventListener("click", closeMobileSidebar);

    const area = document.getElementById("login-form-area");

        <div class="actions"><button type="button" class="secondary" id="btn-change-admin-password">Update password</button></div>
      </fieldset>
    `;
    wirePasswordToggles(pageEl);
    document.getElementById("btn-change-admin-password").addEventListener("click", async () => {
      const newPw = document.getElementById("admin-new-password").value;
      if (!newPw) { announce("Please enter a new password.", true); return; }
      try {
        await api("/admin/password", { method: "PUT", body: JSON.stringify({ new_password: newPw }) });
        announce("Administrator password updated.", false);
        document.getElementById("admin-new-password").value = "";
      } catch (e) { announce(e.message, true); }
    });
  }

  // ===================================================================
  // TEACHER PAGES
  // ===================================================================

  async function pageTeacherDashboard() {
    let me, stats;
    try { [me, stats] = await Promise.all([api("/teacher/me"), api("/teacher/dashboard-stats")]); }
    catch (e) { pageEl.innerHTML = "<p class='muted'>" + escapeHtml(e.message) + "</p>"; return; }
    const avgText = stats.average_performance == null ? "No results yet" : stats.average_performance.toFixed(1) + "%";
    pageEl.innerHTML = `
      <h2>Welcome, ${escapeHtml(me.name)}</h2>
      <div class="stat-cards">
        <div class="stat-card"><div class="stat-value">${stats.total_classes}</div><div class="stat-label">My Classes</div></div>
        <div class="stat-card"><div class="stat-value">${stats.total_students}</div><div class="stat-label">My Learners</div></div>
        <div class="stat-card"><div class="stat-value">${avgText}</div><div class="stat-label">Average Performance</div></div>
      </div>
      <p class="muted">You have access to: ${me.classes.length ? me.classes.map(escapeHtml).join(", ") : "no classes yet — ask an administrator to assign you one."}</p>
    `;
  }

  async function pageTeacherClasses() {
    let me;
    try { me = await api("/teacher/me"); } catch (e) { pageEl.innerHTML = "<p class='muted'>" + escapeHtml(e.message) + "</p>"; return; }
    const classOptions = me.classes.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

    pageEl.innerHTML = `
      <h2>My Classes</h2>
      <fieldset>
        <legend>Enroll or move a learner into your class</legend>
        <label for="t-student-regno">Registration number</label>
        <input type="text" id="t-student-regno" autocomplete="off">
        <label for="t-student-name">Full name (only needed for a new learner)</label>
        <input type="text" id="t-student-name">
        <label for="t-student-class">Class</label>
        <select id="t-student-class"><option value="">Select a class</option>${classOptions}</select>
        <div class="actions"><button type="button" class="primary" id="btn-t-set-class">Save</button></div>
      </fieldset>

      <fieldset>
        <legend>View a class roster</legend>
        <label for="t-view-class">Class</label>
        <select id="t-view-class"><option value="">Select a class</option>${classOptions}</select>
        <div id="t-class-roster"></div>
        <div id="t-student-history"></div>
      </fieldset>
    `;

    document.getElementById("btn-t-set-class").addEventListener("click", async () => {
      const reg_no = document.getElementById("t-student-regno").value.trim();
      const name = document.getElementById("t-student-name").value.trim();
      const class_name = document.getElementById("t-student-class").value;
      if (!reg_no || !class_name) { announce("Please enter a registration number and choose a class.", true); return; }
      try {
        await api("/teacher/students", { method: "POST", body: JSON.stringify({ reg_no, name: name || null, class_name }) });
        announce("Saved.", false); pageTeacherClasses();
      } catch (e) { announce(e.message, true); }
    });

    const viewClassSelect = document.getElementById("t-view-class");
    viewClassSelect.addEventListener("change", async () => {
      const className = viewClassSelect.value;
      const rosterEl = document.getElementById("t-class-roster");
      document.getElementById("t-student-history").innerHTML = "";
      if (!className) { rosterEl.innerHTML = ""; return; }
      try {
        const roster = await api("/teacher/classes/" + encodeURIComponent(className) + "/students");
        if (!roster.length) { rosterEl.innerHTML = "<p class='muted'>No learners in this class yet.</p>"; return; }
        const rows = roster.map((s) => `<tr>
          <td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.reg_no)}</td><td>${s.result_count}</td>
          <td>
            <button type="button" class="small secondary" data-show-history="${escapeHtml(s.reg_no)}">View history</button>
            <button type="button" class="small danger" data-remove-student="${escapeHtml(s.reg_no)}" data-student-name="${escapeHtml(s.name)}">Remove from class</button>
          </td>
        </tr>`).join("");
        rosterEl.innerHTML = `<table><caption>${escapeHtml(className)} roster</caption>
          <tr><th scope="col">Name</th><th scope="col">Registration number</th><th scope="col">Results recorded</th><th scope="col">Actions</th></tr>${rows}</table>`;
        rosterEl.querySelectorAll("[data-show-history]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              const regNo = btn.dataset.showHistory;
              const student = await api("/teacher/students/" + encodeURIComponent(regNo) + "/results");
              const historyEl = document.getElementById("t-student-history");
              historyEl.innerHTML = resultHistoryBlockHtml(student, "/teacher/students/" + encodeURIComponent(regNo) + "/report-card");
              wireReportDownloadButtons(historyEl);
            } catch (e) { announce(e.message, true); }
          });
        });
        rosterEl.querySelectorAll("[data-remove-student]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const regNo = btn.dataset.removeStudent;
            const studentName = btn.dataset.studentName;
            if (!window.confirm("Remove " + studentName + " from " + className + "? Their result history is kept, but they'll no longer show in this class until reassigned.")) return;
            try {
              await api("/teacher/students/" + encodeURIComponent(regNo) + "/class", { method: "DELETE" });
              announce(studentName + " has been removed from " + className + ".", false);
              viewClassSelect.dispatchEvent(new Event("change"));
            } catch (e) { announce(e.message, true); }
          });
        });
      } catch (e) { announce(e.message, true); }
    });
  }

  async function pageTeacherMarksEnter() {
    let me;
    try { me = await api("/teacher/me"); } catch (e) { pageEl.innerHTML = "<p class='muted'>" + escapeHtml(e.message) + "</p>"; return; }
    const classOptions = me.classes.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

    pageEl.innerHTML = `
      <h2>Enter Marks</h2>
      <fieldset>
        <legend>Record a result</legend>
        <label for="t-grade-class">Class</label>
        <select id="t-grade-class"><option value="">Select a class</option>${classOptions}</select>
        <label for="t-grade-student">Learner</label>
        <select id="t-grade-student"><option value="">Select a class first</option></select>
        <label for="t-grade-term">Term or period (e.g. Term 1 2026)</label>
        <input type="text" id="t-grade-term">
        <label for="t-grade-subject">Subject</label>
        <input type="text" id="t-grade-subject">
        ${scoreEntryFieldsHtml("t-grade", "level")}
        <label for="t-grade-comment">Comment / rubric note (optional) — e.g. "CAT 1", "Group work", or feedback on what the level was based on</label>
        <textarea id="t-grade-comment"></textarea>
        <p class="muted">If you enter more than one result for the same learner, subject, and term, they will be added together as the total for that subject.</p>
        <div class="actions"><button type="button" class="primary" id="btn-t-add-grade">Record result</button></div>
      </fieldset>
    `;
    wireScoreEntryToggle(pageEl, "t-grade");

    const gradeClassSelect = document.getElementById("t-grade-class");
    const gradeStudentSelect = document.getElementById("t-grade-student");
    gradeClassSelect.addEventListener("change", async () => {
      const className = gradeClassSelect.value;
      if (!className) { gradeStudentSelect.innerHTML = "<option value=''>Select a class first</option>"; return; }
      try {
        const roster = await api("/teacher/classes/" + encodeURIComponent(className) + "/students");
        gradeStudentSelect.innerHTML = roster.length
          ? roster.map((s) => `<option value="${escapeHtml(s.reg_no)}">${escapeHtml(s.name)} (${escapeHtml(s.reg_no)})</option>`).join("")
          : "<option value=''>No learners in this class</option>";
      } catch (e) { announce(e.message, true); }
    });

    document.getElementById("btn-t-add-grade").addEventListener("click", async () => {
      const reg_no = gradeStudentSelect.value;
      const term = document.getElementById("t-grade-term").value.trim();
      const subject = document.getElementById("t-grade-subject").value.trim();
      const comment = document.getElementById("t-grade-comment").value.trim();
      const entry = readScoreEntry(pageEl, "t-grade");
      if (!reg_no) { announce("Please choose a class and a learner.", true); return; }
      if (!term) { announce("Please enter a term or period.", true); return; }
      if (!subject) { announce("Please enter a subject.", true); return; }
      if (!entry.valid) { announce("Please enter a valid score between 0 and 100.", true); return; }
      try {
        await api("/teacher/results", { method: "POST", body: JSON.stringify({ reg_no, term, subject, score: entry.score, comment: comment || null }) });
        announce("Result recorded.", false);
        document.getElementById("t-grade-term").value = "";
        document.getElementById("t-grade-subject").value = "";
        document.getElementById("t-grade-comment").value = "";
      } catch (e) { announce(e.message, true); }
    });
  }

  async function pageTeacherMarksEdit() {
    let me;
    try { me = await api("/teacher/me"); } catch (e) { pageEl.innerHTML = "<p class='muted'>" + escapeHtml(e.message) + "</p>"; return; }
    const classOptions = me.classes.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

    pageEl.innerHTML = `
      <h2>Edit Marks</h2>
      <fieldset>
        <legend>Edit or remove a recorded result</legend>
        <label for="t-edit-class">Class</label>
        <select id="t-edit-class"><option value="">Select a class</option>${classOptions}</select>
        <label for="t-edit-student">Learner</label>
        <select id="t-edit-student"><option value="">Select a class first</option></select>
        <div class="actions"><button type="button" class="secondary" id="btn-t-load-results">Load results</button></div>
        <div id="t-edit-results-list"></div>
      </fieldset>
    `;

    const editClassSelect = document.getElementById("t-edit-class");
    const editStudentSelect = document.getElementById("t-edit-student");
    editClassSelect.addEventListener("change", async () => {
      const className = editClassSelect.value;
      if (!className) { editStudentSelect.innerHTML = "<option value=''>Select a class first</option>"; return; }
      try {
        const roster = await api("/teacher/classes/" + encodeURIComponent(className) + "/students");
        editStudentSelect.innerHTML = roster.length
          ? roster.map((s) => `<option value="${escapeHtml(s.reg_no)}">${escapeHtml(s.name)} (${escapeHtml(s.reg_no)})</option>`).join("")
          : "<option value=''>No learners in this class</option>";
      } catch (e) { announce(e.message, true); }
    });

    document.getElementById("btn-t-load-results").addEventListener("click", async () => {
      const reg_no = editStudentSelect.value;
      const listEl = document.getElementById("t-edit-results-list");
      if (!reg_no) { announce("Please choose a class and a learner.", true); return; }
      try {
        const student = await api("/teacher/students/" + encodeURIComponent(reg_no) + "/results");
        renderEditableResultsList(listEl, student);
      } catch (e) { announce(e.message, true); }
    });
  }

  function renderEditableResultsList(container, student) {
    if (!student.results.length) {
      container.innerHTML = "<p class='muted'>No results recorded for " + escapeHtml(student.name) + " yet.</p>";
      return;
    }
    container.innerHTML = `<h3>Results for ${escapeHtml(student.name)}</h3>` + student.results.map((r) => `
      <div class="result-row" data-result-id="${r.id}">
        <div class="view-mode">
          <p><strong>${escapeHtml(r.term)} — ${escapeHtml(r.subject)}: ${r.score}%</strong></p>
          ${r.comment ? `<p class="muted">${escapeHtml(r.comment)}</p>` : ""}
          <div class="actions">
            <button type="button" class="small secondary" data-edit-result="${r.id}">Edit</button>
            <button type="button" class="small danger" data-delete-result="${r.id}">Delete</button>
          </div>
        </div>
      </div>
    `).join("");

    container.querySelectorAll("[data-delete-result]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!window.confirm("Delete this result? This cannot be undone.")) return;
        try {
          await api("/teacher/results/" + btn.dataset.deleteResult, { method: "DELETE" });
          announce("Result deleted.", false);
          const updated = await api("/teacher/students/" + encodeURIComponent(student.reg_no) + "/results");
          renderEditableResultsList(container, updated);
        } catch (e) { announce(e.message, true); }
      });
    });

    container.querySelectorAll("[data-edit-result]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const row = btn.closest(".result-row");
        const resultId = btn.dataset.editResult;
        const idPrefix = "edit-" + resultId;
        const r = student.results.find((x) => String(x.id) === String(resultId));
        const defaultMode = levelForScore(r.score) ? "level" : "number";
        row.querySelector(".view-mode").innerHTML = `
          <label>Term or period</label>
          <input type="text" class="edit-term" value="${escapeHtml(r.term)}">
          <label>Subject</label>
          <input type="text" class="edit-subject" value="${escapeHtml(r.subject)}">
          ${scoreEntryFieldsHtml(idPrefix, defaultMode)}
          <label>Comment / rubric note</label>
          <textarea class="edit-comment">${escapeHtml(r.comment || "")}</textarea>
          <div class="actions">
            <button type="button" class="small primary" data-save-result="${r.id}">Save</button>
            <button type="button" class="small secondary" data-cancel-edit>Cancel</button>
          </div>
        `;
        if (defaultMode === "level") document.getElementById(idPrefix + "-level").value = levelForScore(r.score);
        else document.getElementById(idPrefix + "-score").value = r.score;
        wireScoreEntryToggle(row, idPrefix);

        row.querySelector("[data-save-result]").addEventListener("click", async () => {
          const term = row.querySelector(".edit-term").value.trim();
          const subject = row.querySelector(".edit-subject").value.trim();
          const comment = row.querySelector(".edit-comment").value.trim();
          const entry = readScoreEntry(row, idPrefix);
          if (!term || !subject || !entry.valid) { announce("Please fill in a valid term, subject, and score between 0 and 100.", true); return; }
          try {
            await api("/teacher/results/" + resultId, { method: "PUT", body: JSON.stringify({ term, subject, score: entry.score, comment: comment || null }) });
            announce("Result updated.", false);
            const updated = await api("/teacher/students/" + encodeURIComponent(student.reg_no) + "/results");
            renderEditableResultsList(container, updated);
          } catch (e) { announce(e.message, true); }
        });
        row.querySelector("[data-cancel-edit]").addEventListener("click", () => renderEditableResultsList(container, student));
      });
    });
  }

  // Initial load
  renderAll();
})();
